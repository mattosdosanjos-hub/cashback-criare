<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Criare Bazar</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#880e4f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Criare Bazar">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #880e4f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: white;
      padding: 12px;
      margin-bottom: 28px;
    }

    .spin {
      width: 40px; height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: sp 0.9s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes sp { to { transform: rotate(360deg); } }

    p {
      color: rgba(255,255,255,0.85);
      font-size: 16px;
    }
  </style>
</head>
<body>

  <img src="icon-192.png" alt="Criare Bazar">
  <div class="spin"></div>
  <p>Abrindo Criare Bazar...</p>

  <script>
    // Registra service worker para PWA funcionar offline
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    }

    // Redireciona para o Apps Script após 1 segundo (tempo do loading aparecer)
    // SUBSTITUA A URL ABAIXO pela URL do seu formulário
    var URL_FORMULARIO = 'https://script.google.com/macros/s/AKfycby5sBJ9w2M2niV0TgrEl2ED5Lm_n0F3O-B6JT_mEmGoxk4CM9LK0P7mQKN3FqFFEefw3w/exec';

    setTimeout(function() {
      window.location.replace(URL_FORMULARIO);
    }, 800);
  </script>

</body>
</html>
